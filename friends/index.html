<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blip</title>
<meta name="theme-color" content="#2b2350">
<style>
:root{
  --bg:#211a40; --card:#2f2758; --card2:#3a3168; --ink:#fbf8ff; --dim:#c3b9e6; --faint:#8e84b8; --line:rgba(255,255,255,.1);
  --red:#ff5d6c; --orange:#ffa24a; --yellow:#ffd84d; --free:#5fd6a4; --accent:#8b7bff; --win:#5fd6a4; --lose:#ff8a95;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.3px}
h2{font-size:20px;margin:0 0 8px}
p{margin:6px 0}
.dim{color:var(--dim)} .faint{color:var(--faint);font-size:14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;font-weight:600;cursor:pointer;color:var(--ink);background:var(--card2);width:100%}
button.main{background:var(--accent);color:#fff}
button.small{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
button.link{background:none;color:var(--dim);padding:8px;width:auto;font-weight:500;text-decoration:underline}
button.danger{background:#5a2238;color:#ffd3da}
button:disabled{opacity:.5}
.stack>*+*{margin-top:10px}
input[type=text],input[type=time]{font:inherit;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#1a1435;color:var(--ink)}
input.code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:24px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.tier{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tier:first-child{border-top:0}
.tier .what{flex:1;min-width:0}
.tier .cost{font-weight:700;font-variant-numeric:tabular-nums}
.big{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:#1a1435;overflow:hidden;margin:12px 0 4px;display:flex}
.bar i{display:block;height:100%}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600}
.codebox{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;padding:12px;background:#1a1435;border-radius:14px;margin:8px 0}
.topbar{display:flex;justify-content:space-between;align-items:center}
.gear{width:auto;background:var(--card);padding:10px 12px;border-radius:12px;font-size:15px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.step.done .n{background:var(--free);color:#123}
.ticks{margin:6px 0 10px;padding-left:20px;color:var(--dim)}
.ticks li{margin:2px 0}
.overlay{position:fixed;inset:0;background:rgba(14,9,32,.86);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.reveal{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 30%,#4a3c94,#1a1435 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;animation:fade .3s}
.vs{display:flex;gap:16px;width:100%;max-width:380px;margin:24px 0}
.vs>div{flex:1;background:rgba(255,255,255,.07);border-radius:20px;padding:18px 8px}
.vs .score{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.vs .won{outline:3px solid var(--win)}
.verdict{font-size:34px;font-weight:800;opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.verdict.show{opacity:1;transform:scale(1)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px}
table.costs{width:100%;border-collapse:collapse;margin:8px 0}
table.costs td{padding:8px 4px;border-top:1px solid var(--line)}
table.costs td:last-child{text-align:right;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.switch input{width:22px;height:22px}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="config.js"></script>
<script>
'use strict';
// =====================================================================================
// Blip friends game, build 1 (plan v2, Lawyer OK 2026-11-25).
// You and a friend each start the day with 1,000 points. Every 15 minutes in a tier spends points:
// Red 40, Orange 20, Free 0 (Yellow dropped 2026-11-25 to make setup easier). The same for everyone. After midnight, whoever kept more wins.
// Privacy: minutes per tier stay on this phone. Only the day's points total goes online, after the day ends,
// tied to an anonymous player ID and the match code. No names: you name your friend on your own phone.
// =====================================================================================
const IS_APP = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const CFG = window.FRIENDS_CONFIG || {};
const BANK = 1000, STEP = 15;
const TIERS = [
  {id:'red', name:'Red', cost:40, color:'var(--red)', ticks:['Social','Entertainment'], note:'Social media, short video and streaming.'},
  {id:'orange', name:'Orange', cost:20, color:'var(--orange)', ticks:['Games','Shopping & Food','Safari (search for it)'], note:'Games, shopping and web browsing.'},
];
// How many of each Apple should report back: Safari is an app, the rest are categories.
TIERS[0].want = {categories:2, apps:0}; TIERS[1].want = {categories:2, apps:1};
const FREE_TICKS = ['Messages and Phone','Maps','Productivity & Finance','Education','Reading','Health & Fitness','Creativity','Utilities'];
const KEY = 'blip-friends';

// ---------- native bridge (same approach as Blip: no bundler, talk to the bridge directly) ----------
function nativePlugin(name){
  const C = window.Capacitor;
  if (!IS_APP || !C) return null;
  if (C.registerPlugin) return C.registerPlugin(name);
  if (!C.nativePromise) return (C.Plugins && C.Plugins[name]) || null;
  nativePlugin.cache = nativePlugin.cache || {};
  return nativePlugin.cache[name] = nativePlugin.cache[name] || new Proxy({}, {get: (_, m) =>
    m === 'then' ? undefined : opts => C.nativePromise(name, m, opts || {})});
}
// In a browser (for checking the screens) a pretend Screen Time stands in: minutes are added by hand.
const fakeST = {
  _d(){ return S.demo = S.demo || {auth:false, tiers:{}, min:{}, since:''}; },
  async status(){ return {authorized: this._d().auth}; },
  async authorize(){ this._d().auth = true; save(); return {authorized:true}; },
  async tierPick({tier, categories, apps}){ const d = this._d(); d.tiers[tier] = categories; save(); return {picked:true, tomorrow: !!d.ready, categories, apps}; },
  async tierStatus(){ const d = this._d(); const o = {ready: !!d.ready, pending:false, since: d.since}; TIERS.forEach(t => o[t.id] = {apps:0, categories: d.tiers[t.id] || 0}); return o; },
  async friendsStart(){ const d = this._d(); d.ready = true; d.since = d.since || today(); save(); return {started:true}; },
  async friendsResync(){ return {resynced:false}; },
  async friendsMinutes({day}){ const m = this._d().min[day] || {}; const o = {red:m.red||0, orange:m.orange||0}; o.points = points(o); o.sent = !!(S.sent||{})[day]; return o; },
  async friendsSync(){ return {}; }, async friendsWipe(){ delete S.demo; return {}; },
  async remindOn(){ return {granted:true}; }, async remindOff(){ return {}; },
  async env(){ return {testflight:true}; },
};
const ST = nativePlugin('ScreenTime') || fakeST;
const Prefs = nativePlugin('Preferences');

// ---------- save ----------
let S = null;
function load(){ try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ S = null; } S = S || {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} if (Prefs) Prefs.set({key:KEY, value:JSON.stringify(S)}).catch(()=>{}); }
async function restore(){
  if (!Prefs || localStorage.getItem(KEY)) return;
  try { const r = await Prefs.get({key:KEY}); if (r && r.value) { localStorage.setItem(KEY, r.value); load(); } } catch(e){}
}

// ---------- days and points ----------
function dayStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today(){ return dayStr(new Date()); }
function addDays(day, n){ const [y,m,d] = day.split('-').map(Number); return dayStr(new Date(y, m-1, d+n)); }
function weekStart(day){ const [y,m,d] = day.split('-').map(Number); const dt = new Date(y, m-1, d); return addDays(day, -((dt.getDay()+6)%7)); }
function points(m){ return Math.max(0, BANK - TIERS.reduce((s,t) => s + Math.floor((m[t.id]||0)/STEP)*t.cost, 0)); }
function hm(min){ if (!min) return '0m'; const h = Math.floor(min/60), m = min%60; return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m || !h ? m + 'm' : ''); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function friend(){ return (S.match && S.match.name) || 'Your friend'; }

// ---------- online service (Firebase Auth + Firestore REST, no SDK) ----------
const Net = {
  on(){ return !!(CFG.apiKey && CFG.projectId); },
  base(){ return 'https://firestore.googleapis.com/v1/projects/' + CFG.projectId + '/databases/(default)/documents/'; },
  async signIn(){
    if (S.me && S.me.uid) return;
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + CFG.apiKey, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true})});
    if (!r.ok) throw new Error('sign-in');
    const j = await r.json();
    S.me = {uid:j.localId, refresh:j.refreshToken, token:j.idToken, exp:Date.now() + (Number(j.expiresIn)-120)*1000}; save();
  },
  async token(){
    await this.signIn();
    if (S.me.token && Date.now() < S.me.exp) return S.me.token;
    const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + CFG.apiKey, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(S.me.refresh)});
    if (!r.ok) throw new Error('token');
    const j = await r.json();
    Object.assign(S.me, {token:j.id_token, refresh:j.refresh_token, exp:Date.now() + (Number(j.expires_in)-120)*1000}); save();
    return S.me.token;
  },
  async call(method, path, body, query){
    const t = await this.token();
    const r = await fetch(this.base() + path + (query ? '?' + query : ''), {method, headers:{'Authorization':'Bearer ' + t, 'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
    if (r.status === 404) return null;
    if (!r.ok) { const e = new Error('net ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? {} : r.json();
  },
  enc(o){ const f = {}; for (const k in o) { const v = o[k]; f[k] = typeof v === 'number' ? {integerValue:String(v)} : typeof v === 'boolean' ? {booleanValue:v} : v instanceof Date ? {timestampValue:v.toISOString()} : {stringValue:String(v)}; } return {fields:f}; },
  dec(doc){ if (!doc || !doc.fields) return null; const o = {}; for (const k in doc.fields) { const v = doc.fields[k]; o[k] = 'integerValue' in v ? Number(v.integerValue) : 'booleanValue' in v ? v.booleanValue : 'stringValue' in v ? v.stringValue : v.timestampValue; } o._name = doc.name; return o; },
  mask(keys){ return keys.map(k => 'updateMask.fieldPaths=' + k).join('&'); },
};
// Tell the Screen Time extension how to send the total at midnight (it runs even when the app is closed).
function syncNative(){
  const m = S.match;
  if (!Net.on() || !m || m.practice || !m.active || !S.me) return ST.friendsSync({}).catch(()=>{});
  return ST.friendsSync({apiKey:CFG.apiKey, projectId:CFG.projectId, refreshToken:S.me.refresh, uid:S.me.uid, match:m.code}).catch(()=>{});
}

// ---------- matches ----------
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){ let c = ''; const a = new Uint32Array(6); crypto.getRandomValues(a); a.forEach(n => c += CODE_CHARS[n % CODE_CHARS.length]); return c; }
async function createMatch(name){
  await Net.signIn();
  for (let i = 0; i < 4; i++) {
    const code = newCode();
    try {
      await Net.call('PATCH', 'matches/' + code, Net.enc({a:S.me.uid, b:'', startDay:'', ended:false, created:new Date()}), 'currentDocument.exists=false');
      S.match = {code, name, role:'a', active:false, startDay:''}; save(); return;
    } catch(e) { if (e.status !== 400 && e.status !== 409 && e.status !== 412) throw e; }
  }
  throw new Error('code');
}
async function joinMatch(code, name){
  await Net.signIn();
  const doc = Net.dec(await Net.call('GET', 'matches/' + code));
  if (!doc) throw new Error('That code doesn\'t match any invite. Check it and try again.');
  if (doc.ended) throw new Error('That match has ended. Ask for a new code.');
  if (doc.a === S.me.uid) throw new Error('That\'s your own code. Send it to your friend.');
  if (doc.b && doc.b !== S.me.uid) throw new Error('Someone already joined with that code.');
  const start = today();
  if (!doc.b) await Net.call('PATCH', 'matches/' + code, Net.enc({b:S.me.uid, startDay:start}), Net.mask(['b','startDay']) + '&currentDocument.exists=true');
  S.match = {code, name, role:'b', other:doc.a, active:true, startDay:doc.startDay || start}; save();
  await syncNative();
}
// The inviter checks whether the friend has joined yet.
async function checkJoined(){
  const m = S.match;
  if (!m || m.practice || !Net.on()) return;
  const doc = Net.dec(await Net.call('GET', 'matches/' + m.code));
  if (!doc) return;
  if (doc.ended && !m.ended) { m.ended = true; m.active = false; save(); await syncNative(); await ST.remindOff().catch(()=>{}); return; }
  if (!m.active && doc.b) { Object.assign(m, {active:true, other:doc.b, startDay:doc.startDay}); save(); await syncNative(); toast(friend() + ' joined. Your first match day is ' + (doc.startDay === today() ? 'today' : doc.startDay) + '.'); }
}
async function sendDay(day, pts){
  const m = S.match;
  if (m.practice) return true;
  await Net.call('PATCH', 'matches/' + m.code + '/days/' + day + '_' + S.me.uid, Net.enc({uid:S.me.uid, day, points:pts, at:new Date()}));
  return true;
}
async function friendDay(day){
  const m = S.match;
  if (m.practice) { // practice friend: a steady player who usually keeps 600 to 900 points
    let h = 0; for (const c of day + m.code) h = (h*31 + c.charCodeAt(0)) >>> 0;
    return 600 + (h % 31) * 10;
  }
  const doc = Net.dec(await Net.call('GET', 'matches/' + m.code + '/days/' + day + '_' + m.other));
  return doc ? doc.points : null;
}
async function endMatch(){
  const m = S.match;
  if (m && !m.practice && Net.on()) await Net.call('PATCH', 'matches/' + m.code, Net.enc({ended:true}), Net.mask(['ended']));
  S.match = null; save(); await syncNative(); await ST.remindOff().catch(()=>{});
}
// "Delete my data": my daily totals and anonymous account go from the online service, then everything on this phone.
async function deleteAll(){
  if (Net.on() && S.me && S.me.uid) {
    const m = S.match;
    if (m && !m.practice) {
      const list = await Net.call('GET', 'matches/' + m.code + '/days', null, 'pageSize=300');
      for (const doc of (list && list.documents) || []) { const d = Net.dec(doc); if (d.uid === S.me.uid) await Net.call('DELETE', doc.name.split('/documents/')[1]); }
      const slot = m.role === 'a' ? 'a' : 'b';
      await Net.call('PATCH', 'matches/' + m.code, Net.enc({ended:true, [slot]:'deleted'}), Net.mask(['ended', slot])).catch(()=>{});
    }
    const t = await Net.token();
    await fetch('https://identitytoolkit.googleapis.com/v1/accounts:delete?key=' + CFG.apiKey, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({idToken:t})});
  }
  await ST.friendsWipe().catch(()=>{});
  try { localStorage.removeItem(KEY); } catch(e){}
  if (Prefs) await Prefs.remove({key:KEY}).catch(()=>{});
  S = {}; save();
}
// Totals older than 30 days are removed from the online service (privacy policy).
async function trimOld(){
  const m = S.match; if (!m || m.practice || !Net.on() || !m.active) return;
  const last = S.trimmed || ''; if (last === today()) return;
  S.trimmed = today(); save();
  const cutoff = addDays(today(), -30);
  const list = await Net.call('GET', 'matches/' + m.code + '/days', null, 'pageSize=300');
  for (const doc of (list && list.documents) || []) { const d = Net.dec(doc); if (d.uid === S.me.uid && d.day < cutoff) await Net.call('DELETE', doc.name.split('/documents/')[1]).catch(()=>{}); }
  for (const k in (S.results||{})) if (k < cutoff) delete S.results[k];
}

// ---------- the daily cycle: send finished days, fetch the friend's, find what to reveal ----------
let tierInfo = null, todayMin = {red:0, orange:0, points:BANK}, busy = false, offline = false;
async function refresh(){
  if (busy) return; busy = true;
  try {
    await ST.friendsResync().catch(()=>{});
    tierInfo = await ST.tierStatus().catch(() => null);
    todayMin = await ST.friendsMinutes({day:today()}).catch(() => todayMin);
    const m = S.match;
    if (m && !m.active && !m.ended) await checkJoined().catch(() => { offline = true; });
    if (m && m.active) {
      S.results = S.results || {}; S.sent = S.sent || {};
      const since = [m.startDay, tierInfo && tierInfo.since].filter(Boolean).sort().pop() || m.startDay;
      offline = false;
      for (let d = [addDays(today(), -3), since].sort().pop(); d < today(); d = addDays(d, 1)) {
        const r = S.results[d] = S.results[d] || {};
        if (r.me == null) {
          const mm = await ST.friendsMinutes({day:d}).catch(() => null);
          if (mm) { r.me = mm.points; if (mm.sent) S.sent[d] = true; }
        }
        if (r.me != null && !S.sent[d]) {
          try { await sendDay(d, r.me); S.sent[d] = true; ST.friendsSync({sentDay:d}).catch(()=>{}); } catch(e) { offline = true; }
        }
        if (r.them == null) { try { const t = await friendDay(d); if (t != null) r.them = t; } catch(e) { offline = true; } }
      }
      if (!m.practice) { if (!m.ended) await checkJoined().catch(()=>{}); trimOld().catch(()=>{}); }
      save();
    }
  } finally { busy = false; }
  render();
  maybeReveal();
}

// ---------- screens ----------
const $ = s => document.querySelector(s);
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
let screen = 'home', setupTier = 0;

function render(){
  const app = $('#app');
  if (!S.setup) { app.innerHTML = setupView(); return; }
  app.innerHTML = homeView();
}

function setupView(){
  const st = S.setupStep || 'hello';
  if (st === 'hello') return `
    <h1 style="margin-top:32px">Beat a friend at putting your phone down.</h1>
    <p class="dim">You both start every day with ${fmt(BANK)} points. Time on your phone spends them, and social media spends them fastest. Just after midnight you find out who kept more.</p>
    <div class="card stack">
      ${TIERS.map(t => `<div class="row"><span class="dot" style="background:${t.color}"></span><div style="flex:1"><b>${t.name}</b> <span class="faint">${esc(t.note)}</span></div><b>${t.cost}</b></div>`).join('')}
      <div class="row"><span class="dot" style="background:var(--free)"></span><div style="flex:1"><b>Free</b> <span class="faint">Messages, Maps, work and school apps.</span></div><b>0</b></div>
      <p class="faint">Points per 15 minutes. The same for every player.</p>
    </div>
    <button class="main" onclick="go('connect')">Get started</button>`;
  if (st === 'connect') return `
    <h1 style="margin-top:32px">Connect Screen Time</h1>
    <p class="dim">Blip uses Apple's Screen Time to count your time in each tier. Your minutes and apps stay on this phone. Only your daily points total is ever shared, and only with the friend you invite.</p>
    <button class="main" onclick="connectST()">Connect Screen Time</button>
    ${S.stDenied ? '<p class="faint">Screen Time wasn\'t allowed. You can turn it on in Settings > Screen Time, then try again.</p>' : ''}`;
  if (st === 'tiers') {
    const t = TIERS[setupTier];
    return `
    <p class="faint" style="margin-top:24px">Step ${setupTier+1} of ${TIERS.length}</p>
    <h1><span class="dot" style="display:inline-block;background:${t.color};margin-right:8px"></span>${t.name}: ${t.cost} points per 15 min</h1>
    <div class="card"><ul class="ticks">${t.ticks.map(x => `<li><b>${esc(x)}</b></li>`).join('')}</ul>
      <p class="faint">This list stays at the top of Apple's screen while you tick, so there's nothing to remember. Everyone ticks the same ones, so the game is fair.</p></div>
    ${setupTier === TIERS.length - 1 ? `<p class="faint">Everything else is free, like ${FREE_TICKS.map(esc).join(', ')}.</p>` : ''}
    ${S.tickWrong ? `<p class="faint" style="color:var(--lose)">That doesn't look right. Tick only the ones listed, then tap Done.</p>` : ''}
    <button class="main" onclick="pickTier()">${S.tickWrong ? 'Try again' : 'Open Apple\'s list'}</button>`;
  }
  if (st === 'ready') return `
    <h1 style="margin-top:32px">You're set up</h1>
    <p class="dim">Today already counts, from midnight. Next, invite a friend.</p>
    <button class="main" onclick="finishSetup()">Continue</button>`;
  return '';
}
function go(step){ S.setupStep = step; save(); render(); }
async function connectST(){
  const r = await ST.authorize().catch(() => ({authorized:false}));
  if (r.authorized) { S.stDenied = false; setupTier = 0; go('tiers'); } else { S.stDenied = true; save(); render(); }
}
// Opens Apple's list with what to tick pinned above it. Resolves true when the counts match what we asked for.
async function openPicker(t){
  const r = await ST.tierPick({tier:t.id, ticks:t.ticks, categories:t.want.categories, apps:t.want.apps}).catch(() => ({picked:false}));
  if (!r.picked) return null;
  return r.categories === undefined || (r.categories === t.want.categories && r.apps === t.want.apps);
}
async function pickTier(){
  const ok = await openPicker(TIERS[setupTier]);
  if (ok === null) return;
  S.tickWrong = !ok; save();
  if (!ok) { render(); return; }
  if (setupTier < TIERS.length - 1) { setupTier++; render(); return; }
  try { await ST.friendsStart(); go('ready'); } catch(e) { toast('Screen Time didn\'t start. Try again.'); }
}
function finishSetup(){ S.setup = true; delete S.setupStep; save(); refresh(); }

function homeView(){
  const m = todayMin, pts = m.points;
  const spent = TIERS.map(t => ({t, min:m[t.id]||0, pts:Math.floor((m[t.id]||0)/STEP)*t.cost}));
  return `
  <div class="topbar"><h1>Today</h1><button class="gear" onclick="openSettings()">Settings</button></div>
  <div class="card">
    <div class="big">${fmt(pts)}</div>
    <div class="dim">points left of ${fmt(BANK)}</div>
    <div class="bar">${spent.map(s => `<i style="width:${s.pts/BANK*100}%;background:${s.t.color}"></i>`).join('')}</div>
    <div style="margin-top:8px">${spent.map(s => `
      <div class="tier"><span class="dot" style="background:${s.t.color}"></span>
        <div class="what"><b>${s.t.name}</b> <span class="faint">${hm(s.min)}</span></div>
        <div class="cost">${s.pts ? '−' + s.pts : '0'}</div></div>`).join('')}
      <div class="tier"><span class="dot" style="background:var(--free)"></span><div class="what"><b>Free</b> <span class="faint">Messages, Maps, work, school</span></div><div class="cost">0</div></div>
    </div>
    <p class="faint">Blip's count, in 15-minute steps. It can differ a little from iPhone's Screen Time.${tierInfo && tierInfo.pending ? ' Your tier changes start tomorrow.' : ''}</p>
  </div>
  ${matchView()}
  ${!IS_APP ? demoTools() : ''}`;
}

function record(){
  const r = S.results || {}, m = S.match; let w = 0, l = 0, t = 0, ww = 0, wl = 0;
  const wk = weekStart(addDays(today(), -1));
  for (const d in r) {
    if (!m || d < m.startDay || d >= today() || r[d].me == null || r[d].them == null) continue;
    const res = r[d].me > r[d].them ? 1 : r[d].me < r[d].them ? -1 : 0;
    if (res > 0) w++; else if (res < 0) l++; else t++;
    if (d >= wk) { if (res > 0) ww++; else if (res < 0) wl++; }
  }
  return {w, l, t, ww, wl};
}
function lastResult(){
  const m = S.match; if (!m || !m.active) return null;
  const y = addDays(today(), -1); if (y < m.startDay) return null;
  return {day:y, ...(S.results && S.results[y] || {})};
}
function matchView(){
  const m = S.match;
  if (!m) return `
    <div class="card stack">
      <h2>Play a friend</h2>
      <p class="dim">Send a friend a code. Once they join, every day is a match.</p>
      ${Net.on() ? `<button class="main" onclick="openInvite()">Invite a friend</button><button onclick="openJoin()">I have a code</button>`
                 : `<p class="faint">Playing with friends isn't switched on in this test build yet.</p>`}
      ${S.testflight || !IS_APP ? `<button onclick="startPractice()">Practice against a pretend friend</button><p class="faint">Test builds only.</p>` : ''}
    </div>`;
  if (m.ended) return `
    <div class="card stack"><h2>Match ended</h2><p class="dim">${esc(friend())} ended the match.</p>
      <button class="main" onclick="clearMatch()">Start a new match</button></div>`;
  if (!m.active) return `
    <div class="card stack"><h2>Waiting for ${esc(friend())}</h2>
      <p class="dim">Send this code. The match starts the day they join.</p>
      <div class="codebox">${esc(m.code)}</div>
      <button class="main" onclick="shareCode()">Send the code</button>
      <button onclick="refresh()">Check again</button></div>`;
  const rec = record(), last = lastResult();
  let lastLine = '';
  if (last && last.me != null && last.them != null) {
    const diff = Math.abs(last.me - last.them);
    lastLine = `<button onclick="showReveal('${last.day}')">${last.me > last.them ? 'Yesterday: you won by ' + fmt(diff) : last.me < last.them ? 'Yesterday: ' + esc(friend()) + ' won by ' + fmt(diff) : 'Yesterday: a tie'} · Replay</button>`;
  } else if (last) {
    lastLine = `<p class="dim">Yesterday: waiting for ${esc(friend())}'s phone to send its total.${offline ? ' (No connection right now.)' : ''}</p>`;
  }
  return `
    <div class="card stack">
      <div class="spread"><h2 style="margin:0">You vs ${esc(friend())}</h2>${m.practice ? '<span class="pill">Practice</span>' : ''}</div>
      <p class="dim">${esc(friend())}'s score is hidden until midnight.</p>
      <div class="spread"><span>This week</span><b>You ${rec.ww} · ${esc(friend())} ${rec.wl}</b></div>
      <div class="spread"><span>All time</span><b>${rec.w} won · ${rec.l} lost${rec.t ? ' · ' + rec.t + ' tied' : ''}</b></div>
      ${m.startDay === today() ? '<p class="faint">Today is your first match day. Results arrive just after midnight.</p>' : ''}
      ${lastLine}
    </div>`;
}

// ---------- invite / join ----------
function sheet(html){ closeSheet(); const o = document.createElement('div'); o.className = 'overlay'; o.id = 'sheet'; o.innerHTML = `<div class="sheet">${html}</div>`; o.addEventListener('click', e => { if (e.target === o) closeSheet(); }); document.body.appendChild(o); }
function closeSheet(){ const o = $('#sheet'); if (o) o.remove(); }
function nameField(){ return `<label class="faint">What do you call your friend? Only you see this.</label><input type="text" id="fname" maxlength="20" placeholder="Sam" autocomplete="off">`; }
function openInvite(){ sheet(`<div class="stack"><h2>Invite a friend</h2>${nameField()}<button class="main" id="go" onclick="doInvite()">Make a code</button><button class="link" onclick="closeSheet()">Cancel</button></div>`); }
function openJoin(){ sheet(`<div class="stack"><h2>Join a friend</h2><label class="faint">Their 6-letter code</label><input type="text" class="code" id="fcode" maxlength="6" autocomplete="off" autocapitalize="characters">${nameField()}<p class="faint" id="err"></p><button class="main" id="go" onclick="doJoin()">Join</button><button class="link" onclick="closeSheet()">Cancel</button></div>`); }
async function doInvite(){
  const b = $('#go'); b.disabled = true;
  try { await createMatch(($('#fname').value || '').trim() || 'Your friend'); closeSheet(); render(); }
  catch(e) { b.disabled = false; toast('Couldn\'t reach Blip\'s server. Check your connection.'); }
}
async function doJoin(){
  const code = ($('#fcode').value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) { $('#err').textContent = 'Codes have 6 letters and numbers.'; return; }
  const b = $('#go'); b.disabled = true;
  try { await joinMatch(code, ($('#fname').value || '').trim() || 'Your friend'); closeSheet(); await askNotify(); refresh(); }
  catch(e) { b.disabled = false; $('#err').textContent = /^net|sign-in|token|Failed/.test(e.message) ? 'Couldn\'t reach Blip\'s server. Check your connection.' : e.message; }
}
async function shareCode(){
  const text = 'Think you can stay off your phone longer than me? Get Blip and join my match with code ' + S.match.code + '.';
  try { if (navigator.share) { await navigator.share({text}); return; } } catch(e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into a message.'); } catch(e) { toast('Your code is ' + S.match.code); }
}
function startPractice(){ S.match = {code:'P' + Date.now().toString(36).toUpperCase(), name:'Pat', practice:true, active:true, startDay:today()}; save(); askNotify().then(refresh); }
function clearMatch(){ S.match = null; save(); render(); }

// ---------- morning notification (never at midnight) ----------
async function askNotify(){
  if (S.notify) return;
  S.notify = {on:true, time:'08:00'}; save();
  await applyNotify();
}
async function applyNotify(){
  const n = S.notify;
  if (!n || !n.on || !S.match) return ST.remindOff().catch(()=>{});
  const [h, m] = n.time.split(':').map(Number);
  const r = await ST.remindOn({hour:h, minute:m, name:'Blip', body:'Yesterday\'s results are in. See who won.'}).catch(() => ({granted:false}));
  if (!r.granted) { n.on = false; save(); toast('Notifications are off for Blip in iPhone Settings.'); }
}

// ---------- the reveal ----------
function maybeReveal(){
  const last = lastResult();
  if (!last || last.me == null || last.them == null || (S.seen || '') >= last.day) return;
  showReveal(last.day);
}
function showReveal(day){
  const r = (S.results || {})[day]; if (!r) return;
  S.seen = [S.seen || '', day].sort().pop(); save();
  const o = document.createElement('div'); o.className = 'reveal'; o.id = 'reveal';
  const name = esc(friend());
  o.innerHTML = `<p class="dim">${day === addDays(today(), -1) ? 'Yesterday' : esc(day)}</p>
    <div class="vs"><div id="vme"><div class="dim">You</div><div class="score" id="sme">0</div></div>
    <div id="vthem"><div class="dim">${name}</div><div class="score" id="sthem">0</div></div></div>
    <div class="verdict" id="verdict"></div><p class="dim" id="by" style="min-height:24px"></p>
    <div style="width:100%;max-width:380px;margin-top:24px"><button class="main" onclick="document.getElementById('reveal').remove()">Done</button></div>`;
  document.body.appendChild(o);
  const dur = 1600, t0 = performance.now();
  (function tick(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    $('#sme').textContent = fmt(Math.round(r.me * e)); $('#sthem').textContent = fmt(Math.round(r.them * e));
    if (k < 1) return requestAnimationFrame(tick);
    const v = $('#verdict'), diff = Math.abs(r.me - r.them);
    v.textContent = r.me > r.them ? 'You won!' : r.me < r.them ? name + ' won' : 'It\'s a tie';
    v.style.color = r.me > r.them ? 'var(--win)' : r.me < r.them ? 'var(--lose)' : 'var(--ink)';
    if (r.me !== r.them) $(r.me > r.them ? '#vme' : '#vthem').classList.add('won');
    v.classList.add('show');
    $('#by').textContent = diff ? 'by ' + fmt(diff) + ' points' + (r.me < r.them ? '. Today\'s a new day.' : '') : 'Same points. Rematch today.';
  })(t0);
}

// ---------- settings ----------
function openSettings(){
  const n = S.notify || {on:false, time:'08:00'}, m = S.match;
  sheet(`<div class="stack">
    <div class="spread"><h2 style="margin:0">Settings</h2><button class="small" onclick="closeSheet()">Done</button></div>
    <div class="card">
      <div class="switch"><span>Morning results notification</span><input type="checkbox" id="non" ${n.on ? 'checked' : ''} onchange="setNotify()"></div>
      <div class="switch"><span class="dim">Time</span><input type="time" id="ntime" value="${n.time}" style="width:140px" onchange="setNotify()"></div>
      <p class="faint">Results are ready just after midnight. The notification waits until this time.</p>
    </div>
    <div class="card"><h2>How points work</h2>
      <table class="costs">${TIERS.map(t => `<tr><td><span class="dot" style="display:inline-block;background:${t.color};margin-right:8px"></span>${t.name}: ${t.ticks.map(esc).join(', ')}</td><td>${t.cost}</td></tr>`).join('')}
      <tr><td><span class="dot" style="display:inline-block;background:var(--free);margin-right:8px"></span>Free: everything not ticked</td><td>0</td></tr></table>
      <p class="faint">Points per 15 minutes, out of ${fmt(BANK)} a day. The same for every player.</p>
      <button onclick="changeTiers()">Change what I ticked (starts tomorrow)</button>
    </div>
    ${m ? `<div class="card"><button onclick="confirmEnd()">End match with ${esc(friend())}</button></div>` : ''}
    <div class="card stack"><h2>Privacy</h2>
      <p class="faint">Your minutes and apps stay on this phone. Only your daily points total is sent, after the day ends, and only your match can see it. Totals are deleted after 30 days.</p>
      <button class="danger" onclick="confirmDelete()">Delete my data</button></div>
  </div>`);
}
async function setNotify(){ S.notify = {on:$('#non').checked, time:$('#ntime').value || '08:00'}; save(); await applyNotify(); }
async function changeTiers(){
  for (const t of TIERS) {
    const ok = await new Promise(res => {
      sheet(`<div class="stack"><h2>${t.name}: ${t.cost} points per 15 min</h2><ul class="ticks">${t.ticks.map(x => `<li><b>${esc(x)}</b></li>`).join('')}</ul><p class="faint">This list stays on screen while you tick.</p><button class="main" id="ok">Open Apple's list</button><button class="link" id="no">Stop</button></div>`);
      $('#ok').onclick = () => res(true); $('#no').onclick = () => res(false);
    });
    closeSheet(); if (!ok) break;
    let good = await openPicker(t);
    while (good === false) {
      const again = await new Promise(res => {
        sheet(`<div class="stack"><h2>That doesn't look right</h2><p class="dim">For ${t.name}, tick only: ${t.ticks.map(esc).join(', ')}.</p><button class="main" id="ok">Try again</button><button class="link" id="no">Skip</button></div>`);
        $('#ok').onclick = () => res(true); $('#no').onclick = () => res(false);
      });
      closeSheet(); if (!again) break;
      good = await openPicker(t);
    }
  }
  toast('Saved. Your changes start tomorrow.'); refresh();
}
function confirmEnd(){ sheet(`<div class="stack"><h2>End the match?</h2><p class="dim">${esc(friend())} will see that the match ended. Your record stays on this phone.</p><button class="danger" onclick="doEnd()">End match</button><button class="link" onclick="openSettings()">Cancel</button></div>`); }
async function doEnd(){ try { await endMatch(); closeSheet(); render(); } catch(e) { toast('Couldn\'t reach Blip\'s server. Try again.'); } }
function confirmDelete(){ sheet(`<div class="stack"><h2>Delete my data?</h2><p class="dim">This ends any match, deletes your daily totals and your anonymous account from Blip's server, and clears this phone. It can't be undone.</p><button class="danger" id="del" onclick="doDelete()">Delete everything</button><button class="link" onclick="openSettings()">Cancel</button></div>`); }
async function doDelete(){ $('#del').disabled = true; try { await deleteAll(); closeSheet(); render(); toast('Your data was deleted.'); } catch(e) { $('#del').disabled = false; toast('Couldn\'t reach Blip\'s server. Try again with a connection.'); } }

// ---------- browser-only test tools (never in the app) ----------
function demoTools(){
  return `<div class="card stack"><p class="faint">Browser check only: add pretend time.</p>
    <div class="row">${TIERS.map(t => `<button class="small" onclick="demoAdd('${t.id}')">+15m ${t.name}</button>`).join('')}</div>
    <button class="small" onclick="demoNextDay()">Pretend a day passed</button></div>`;
}
function demoAdd(t){ const d = fakeST._d(); const m = d.min[today()] = d.min[today()] || {}; m[t] = (m[t]||0) + 15; save(); refresh(); }
function demoNextDay(){ const d = fakeST._d(); const y = addDays(today(), -1); d.min[y] = d.min[today()] || {red:60, orange:30}; d.since = y; if (S.match) S.match.startDay = y; S.seen = ''; delete (S.results||{})[y]; delete (S.sent||{})[y]; save(); refresh(); }

// ---------- start ----------
(async function start(){
  load(); await restore();
  render();
  ST.env().then(e => { S.testflight = !!(e && e.testflight); render(); }).catch(()=>{});
  if (S.setup) {
    const s = await ST.status().catch(() => ({authorized:true}));
    if (IS_APP && s && s.authorized === false) { S.setup = false; S.setupStep = 'connect'; save(); render(); return; }
    await syncNative();
    refresh();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.setup) refresh(); });
})();
</script>
</body>
