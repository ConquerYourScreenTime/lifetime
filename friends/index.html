<body>
<div class="app" id="app"></div>
<script src="config.js"></script>
<script>
'use strict';
// =====================================================================================
// Conquer Your Screen Time (build 4, design handoff 2026-11-25).
// Every player starts the day with 1,000 points. Every 15 minutes in a tier spends points: Red 40, Orange 20, Free 0.
// The same for everyone. Anyone can download and play (no invite needed, invites are free). Up to 6 separate
// one-on-one rivalries; one daily score counts in every match. Results open for everyone at 8 AM their time, sealed until the player breaks the seal.
// Privacy: minutes per tier stay on this phone. Only the day's points total goes online, after the day ends,
// once per match, tied to an anonymous player ID and the match code. No names: you name your rivals on your own phone.
// =====================================================================================
const IS_APP = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const CFG = window.FRIENDS_CONFIG || {};
const BANK = 1000, STEP = 15, REVEAL_HOUR = 8, MAX_RIVALS = 6, KEEP_DAYS = 40;
const TIERS = [
  {id:'red', name:'Red', cost:40, color:'var(--red)', ticks:['Social','Entertainment'], note:'Social media, short video and streaming.'},
  {id:'orange', name:'Orange', cost:20, color:'var(--orange)', ticks:['Games','Shopping & Food','Safari'], note:'Games, shopping and web browsing.'},
];
// How many of each Apple should report back: Safari is an app, the rest are categories.
TIERS[0].want = {categories:2, apps:0}; TIERS[1].want = {categories:2, apps:1};

// ---------- native bridge (no bundler, talk to the bridge directly) ----------
function nativePlugin(name){
  const C = window.Capacitor;
  if (!IS_APP || !C) return null;
  if (C.registerPlugin) return C.registerPlugin(name);
  if (!C.nativePromise) return (C.Plugins && C.Plugins[name]) || null;
  nativePlugin.cache = nativePlugin.cache || {};
  return nativePlugin.cache[name] = nativePlugin.cache[name] || new Proxy({}, {get: (_, m) =>
    m === 'then' ? undefined : opts => C.nativePromise(name, m, opts || {})});
}

// ---------- save ----------
let S = null;
function load(){ try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ S = null; } S = S || {}; migrate(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} if (Prefs) Prefs.set({key:KEY, value:JSON.stringify(S)}).catch(()=>{}); }
async function restore(){
  if (!Prefs || localStorage.getItem(KEY)) return;
  try { const r = await Prefs.get({key:KEY}); if (r && r.value) { localStorage.setItem(KEY, r.value); load(); } } catch(e){}
}
// Builds 1 to 3 kept one match (S.match) and results by day. Build 4 keeps a list of matches.
function migrate(){
  S.matches = S.matches || [];
  S.mine = S.mine || {}; S.res = S.res || {}; S.sentTo = S.sentTo || {};
  if (S.match) {
    const m = S.match; if (m.practice) m.role = 'p';
    m.made = m.made || m.startDay || today();
    S.matches.push(m);
    for (const d in (S.results || {})) { const r = S.results[d]; if (r.me != null) S.mine[d] = r.me; if (r.them != null) (S.res[m.code] = S.res[m.code] || {})[d] = r.them; }
    for (const d in (S.sent || {})) (S.sentTo[m.code] = S.sentTo[m.code] || {})[d] = true;
  }
  delete S.match; delete S.results; delete S.sent;
}

// ---------- days and points ----------
function dayStr(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today(){ return dayStr(new Date()); }
function toDate(day){ const [y,m,d] = day.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(day, n){ const dt = toDate(day); return dayStr(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n)); }
function diffDays(a, b){ return Math.round((toDate(b) - toDate(a)) / 864e5); }
function weekStart(day){ return addDays(day, -((toDate(day).getDay()+6)%7)); }
function weekday(day){ return toDate(day).toLocaleDateString('en-US', {weekday:'long'}); }
// The newest day whose result is open: yesterday from 8 AM, the day before until then.
function resultDay(){ return addDays(today(), new Date().getHours() >= REVEAL_HOUR ? -1 : -2); }
function points(m){ return Math.max(0, BANK - TIERS.reduce((s,t) => s + Math.floor((m[t.id]||0)/STEP)*t.cost, 0)); }
function hm(min){ if (!min) return '0 min'; const h = Math.floor(min/60), m = min%60; return (h ? h + ' hr' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : ''); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function initial(n){ return esc((n || '?').trim().charAt(0).toUpperCase()); }
function avatar(m){ const i = S.matches.indexOf(m); return `<div class="av" style="background:${AV_COLORS[(i < 0 ? 0 : i) % AV_COLORS.length]}">${initial(m.name)}</div>`; }
function listNames(a){ return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length-1]; }

// ---------- matches and scores ----------
function rivals(){ return S.matches.filter(m => m.active && !m.ended); }
function own(){ return S.matches.filter(m => m.role === 'a'); }
function inviter(){ return S.matches.find(m => m.role === 'b' && !m.ended); }
function waiting(){ return own().filter(m => !m.active && !m.ended); }
function them(m, d){ return (S.res[m.code] || {})[d]; }
// One shared day: both totals in, and the day is in this match. A late joiner compares only shared days.
function pair(m, d){ const a = S.mine[d], b = them(m, d); return m.startDay && d >= m.startDay && a != null && b != null ? [a, b] : null; }
function totals(m, from, to){ let a = 0, b = 0, n = 0; for (let d = from; d <= to; d = addDays(d, 1)) { const p = pair(m, d); if (p) { a += p[0]; b += p[1]; n++; } } return {a, b, n}; }
function dayCrowns(d){ let won = 0, of = 0; for (const m of rivals()) { const p = pair(m, d); if (p) { of++; if (p[0] > p[1]) won++; } } return {won, of}; }
function weekLeads(){ const open = resultDay(), ws = weekStart(open); let lead = 0, of = 0; for (const m of rivals()) { const t = totals(m, ws, open); if (t.n) { of++; if (t.a > t.b) lead++; } } return {lead, of}; }
function streak(m){ let n = 0; for (let d = resultDay(); n < 400; d = addDays(d, -1)) { const p = pair(m, d); if (!p || p[0] <= p[1]) break; n++; } return n; }

// ---------- online service (Firebase Auth + Firestore REST, no SDK) ----------
const Net = {
  on(){ return !!(CFG.apiKey && CFG.projectId); },
  base(){ return 'https://firestore.googleapis.com/v1/projects/' + CFG.projectId + '/databases/(default)/documents/'; },
  async signIn(){
    if (S.me && S.me.uid) return;
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + CFG.apiKey, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({returnSecureToken:true})});
    if (!r.ok) throw new Error('sign-in');
    const j = await r.json();
    S.me = {uid:j.localId, refresh:j.refreshToken, token:j.idToken, exp:Date.now() + (Number(j.expiresIn)-120)*1000}; save();
  },
  async token(){
    await this.signIn();
    if (S.me.token && Date.now() < S.me.exp) return S.me.token;
    const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + CFG.apiKey, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(S.me.refresh)});
    if (!r.ok) throw new Error('token');
    const j = await r.json();
    Object.assign(S.me, {token:j.id_token, refresh:j.refresh_token, exp:Date.now() + (Number(j.expires_in)-120)*1000}); save();
    return S.me.token;
  },
  async call(method, path, body, query){
    const t = await this.token();
    const r = await fetch(this.base() + path + (query ? '?' + query : ''), {method, headers:{'Authorization':'Bearer ' + t, 'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
    if (r.status === 404) return null;
    if (!r.ok) { const e = new Error('net ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? {} : r.json();
  },
  enc(o){ const f = {}; for (const k in o) { const v = o[k]; f[k] = typeof v === 'number' ? {integerValue:String(v)} : typeof v === 'boolean' ? {booleanValue:v} : v instanceof Date ? {timestampValue:v.toISOString()} : {stringValue:String(v)}; } return {fields:f}; },
  dec(doc){ if (!doc || !doc.fields) return null; const o = {}; for (const k in doc.fields) { const v = doc.fields[k]; o[k] = 'integerValue' in v ? Number(v.integerValue) : 'booleanValue' in v ? v.booleanValue : 'stringValue' in v ? v.stringValue : v.timestampValue; } o._name = doc.name; return o; },
  mask(keys){ return keys.map(k => 'updateMask.fieldPaths=' + k).join('&'); },
};
// Tell the Screen Time extension how to send the total at midnight (it runs even when the app is closed): one upload per match.
function syncNative(){
  const codes = rivals().filter(m => m.role !== 'p').map(m => m.code);
  if (!Net.on() || !codes.length || !S.me) return ST.friendsSync({}).catch(()=>{});
  return ST.friendsSync({apiKey:CFG.apiKey, projectId:CFG.projectId, refreshToken:S.me.refresh, uid:S.me.uid, match:codes.join(',')}).catch(()=>{});
}

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){ let c = ''; const a = new Uint32Array(6); crypto.getRandomValues(a); a.forEach(n => c += CODE_CHARS[n % CODE_CHARS.length]); return c; }
function cleanCode(s){ return (s || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^BLIP(?=.{6}$)/, ''); }
async function createMatch(name){
  await Net.signIn();
  for (let i = 0; i < 4; i++) {
    const code = newCode();
    try {
      await Net.call('PATCH', 'matches/' + code, Net.enc({a:S.me.uid, b:'', startDay:'', ended:false, created:new Date()}), 'currentDocument.exists=false');
      const m = {code, name, role:'a', active:false, startDay:'', made:today()};
      S.matches.push(m); save(); return m;
    } catch(e) { if (e.status !== 400 && e.status !== 409 && e.status !== 412) throw e; }
  }
  throw new Error('code');
}
async function checkCode(code){
  await Net.signIn();
  const doc = Net.dec(await Net.call('GET', 'matches/' + code));
  if (!doc) throw new Error('That code doesn\'t match any invitation. Check it and try again.');
  if (doc.ended) throw new Error('That invitation has expired. Ask your friend for a new one.');
  if (doc.a === S.me.uid) throw new Error('That\'s your own invitation. Send it to a friend.');
  if (doc.b && doc.b !== S.me.uid) throw new Error('Someone already used that invitation.');
  if (S.matches.some(m => m.code === code)) throw new Error('You\'re already playing with that code.');
  return doc;
}
async function joinMatch(code, name){
  const doc = await checkCode(code);
  const start = today();
  if (!doc.b) await Net.call('PATCH', 'matches/' + code, Net.enc({b:S.me.uid, startDay:start}), Net.mask(['b','startDay']) + '&currentDocument.exists=true');
  const m = {code, name, role:'b', other:doc.a, active:true, startDay:doc.startDay || start, made:today()};
  if (doc.demo === true) demoHistory(m);
  S.matches.push(m); save();
  await syncNative();
}
// App Review demo battle (tracker row 12). Only a match document marked demo:true on the server does this, and
// players can't create one (the Firestore rules only allow a, b, startDay, ended and created). The reviewer joins
// alone on one phone, so the 5 days before joining are filled in for both sides: 3 crowns won, yesterday included,
// so the morning reveal, the crowns and the battle screen have something to show. Normal late joiners still compare
// only the days both players were in.
const DEMO_ME = [742, 610, 815, 688, 790], DEMO_THEM = [700, 655, 760, 720, 735];
function demoHistory(m){
  m.demo = true; m.startDay = addDays(today(), -DEMO_ME.length);
  const r = S.res[m.code] = S.res[m.code] || {};
  DEMO_ME.forEach((v, i) => { const d = addDays(m.startDay, i); if (S.mine[d] == null) S.mine[d] = v; r[d] = DEMO_THEM[i]; });
}
// The inviter checks whether invitees have joined, and whether any match was ended by the other player (once a day).
async function checkMatches(){
  if (!Net.on()) return;
  for (const m of S.matches) {
    if (m.role === 'p' || m.ended) continue;
    if (m.active && m.checked === today()) continue;
    const doc = Net.dec(await Net.call('GET', 'matches/' + m.code));
    if (!doc) continue;
    if (doc.ended) { m.ended = true; m.active = false; save(); await syncNative(); continue; }
    if (!m.active && doc.b) { Object.assign(m, {active:true, other:doc.b, startDay:doc.startDay}); save(); await syncNative(); applyNotify().catch(()=>{}); toast(m.name + ' joined. Your first battle day is ' + (doc.startDay === today() ? 'today' : weekday(doc.startDay)) + '.'); }
    if (m.active) m.checked = today();
  }
}
async function sendDay(m, day, pts){
  await Net.call('PATCH', 'matches/' + m.code + '/days/' + day + '_' + S.me.uid, Net.enc({uid:S.me.uid, day, points:pts, at:new Date()}));
}
function practiceDay(m, day){ let h = 0; for (const c of day + m.code) h = (h*31 + c.charCodeAt(0)) >>> 0; return 600 + (h % 31) * 10; }
// One read per match fetches every total the rival has sent (the server keeps 40 days).
async function fetchRival(m){
  const list = await Net.call('GET', 'matches/' + m.code + '/days', null, 'pageSize=300');
  const r = S.res[m.code] = S.res[m.code] || {};
  for (const doc of (list && list.documents) || []) { const d = Net.dec(doc); if (d && d.uid === m.other) r[d.day] = d.points; }
}
async function endMatch(m){
  if (m.role !== 'p' && Net.on()) await Net.call('PATCH', 'matches/' + m.code, Net.enc({ended:true}), Net.mask(['ended']));
  S.matches = S.matches.filter(x => x !== m); delete S.res[m.code]; delete S.sentTo[m.code];
  save(); await syncNative(); applyNotify().catch(()=>{});
}
// "Delete my data": my daily totals and anonymous account go from the online service, then everything on this phone.
async function deleteAll(){
  if (Net.on() && S.me && S.me.uid) {
    for (const m of S.matches) {
      if (m.role === 'p') continue;
      const list = await Net.call('GET', 'matches/' + m.code + '/days', null, 'pageSize=300').catch(() => null);
      for (const doc of (list && list.documents) || []) { const d = Net.dec(doc); if (d.uid === S.me.uid) await Net.call('DELETE', doc.name.split('/documents/')[1]); }
      const slot = m.role === 'a' ? 'a' : 'b';
      await Net.call('PATCH', 'matches/' + m.code, Net.enc({ended:true, [slot]:'deleted'}), Net.mask(['ended', slot])).catch(()=>{});
    }
    const t = await Net.token();
    await fetch('https://identitytoolkit.googleapis.com/v1/accounts:delete?key=' + CFG.apiKey, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({idToken:t})});
  }
  await ST.friendsWipe().catch(()=>{});
  await ST.conquerWidget({}).catch(()=>{});
  try { localStorage.removeItem(KEY); } catch(e){}
  if (Prefs) await Prefs.remove({key:KEY}).catch(()=>{});
  S = {}; migrate(); save();
}
// Totals older than 40 days are removed from the online service (privacy policy, Lawyer ruling 2026-11-25).
async function trimOld(){
  if (S.trimmed === today()) return;
  S.trimmed = today(); save();
  const cutoff = addDays(today(), -KEEP_DAYS);
  if (Net.on() && S.me) for (const m of rivals()) {
    if (m.role === 'p') continue;
    const list = await Net.call('GET', 'matches/' + m.code + '/days', null, 'pageSize=300').catch(() => null);
    for (const doc of (list && list.documents) || []) { const d = Net.dec(doc); if (d.uid === S.me.uid && d.day < cutoff) await Net.call('DELETE', doc.name.split('/documents/')[1]).catch(()=>{}); }
  }
  for (const d in S.mine) if (d < cutoff) delete S.mine[d];
  for (const c in S.res) for (const d in S.res[c]) if (d < cutoff) delete S.res[c][d];
  for (const c in S.sentTo) for (const d in S.sentTo[c]) if (d < cutoff) delete S.sentTo[c][d];
  save();
}

// ---------- the daily cycle: send finished days, fetch rivals' totals, find what to reveal ----------
let tierInfo = null, todayMin = {red:0, orange:0, points:BANK}, busy = false, offline = false, wallUntil = 0;
async function refresh(){
  if (busy) return; busy = true;
  try {
    await ST.friendsResync().catch(()=>{});
    await ST.weaponsResume().catch(()=>{});
    await loadWeapons().catch(()=>{});   // Today shows missions and active weapons
    tierInfo = await ST.tierStatus().catch(() => null);
    todayMin = await ST.friendsMinutes({day:today()}).catch(() => todayMin);
    wallUntil = dynasty() ? ((await ST.wallStatus().catch(() => ({until:0}))).until || 0) : 0;
    offline = false;
    await checkMatches().catch(() => { offline = true; });
    const since = (tierInfo && tierInfo.since) || '';
    const first = rivals().map(m => m.startDay).filter(Boolean).sort()[0];
    if (first) {
      // My own totals for finished days, from this phone (kept 40 days).
      for (let d = [addDays(today(), -KEEP_DAYS), first, since].filter(Boolean).sort().pop(); d < today(); d = addDays(d, 1)) {
        if (S.mine[d] != null) continue;
        const mm = await ST.friendsMinutes({day:d}).catch(() => null);
        if (mm && !mm.none) S.mine[d] = mm.points;
      }
      for (const m of rivals()) {
        const sent = S.sentTo[m.code] = S.sentTo[m.code] || {};
        const from = [addDays(today(), m.role === 'p' ? -KEEP_DAYS : -7), m.startDay, since].filter(Boolean).sort().pop();
        let missing = false;
        for (let d = from; d < today(); d = addDays(d, 1)) {
          if (m.role === 'p') { if (them(m, d) == null) (S.res[m.code] = S.res[m.code] || {})[d] = practiceDay(m, d); continue; }
          if (S.mine[d] != null && !sent[d]) { try { await sendDay(m, d, S.mine[d]); sent[d] = true; } catch(e) { offline = true; } }
          if (them(m, d) == null) missing = true;
        }
        if (missing && m.role !== 'p') await fetchRival(m).catch(() => { offline = true; });
      }
      trimOld().catch(()=>{});
    }
    save();
  } finally { busy = false; }
  render();
  pushWidget();
  maybeReveal();
}

// The invite page tells a new player to copy their code, then "it offers to paste your code". Reading the clipboard
// only on this tap means iOS asks for paste permission only then. Takes a bare code or the whole invite link.
async function pasteCode(){
  let t = '';
  try { t = await navigator.clipboard.readText(); } catch(e) {}
  const m = /[?&]c=([A-Za-z0-9-]+)/.exec(t || '');
  const code = cleanCode(m ? m[1] : t);
  S.showCode = true; render();
  if (code.length === 6) { $('#wcode').value = code; welcomeJoin(); }
  else { $('#err').textContent = t ? 'That doesn\'t look like a code. Type it in instead.' : 'Nothing to paste. Copy your code from the invite, or type it in.'; $('#wcode').focus(); }
}

function matchesView(){
  const tab = pageState.tab, open = resultDay(), rs = rivals();

  else {
    const from = tab === 'day' ? open : tab === 'week' ? weekStart(open) : addDays(open, -29);
    const rows = rs.map(m => ({m, ...totals(m, from, open)}));
    const has = rows.filter(r => r.n), ahead = has.filter(r => r.a > r.b), behind = has.filter(r => r.a <= r.b), none = rows.filter(r => !r.n);
    const left = 6 - ((toDate(open).getDay()+6)%7);
    const rule = tab === 'day' ? 'Daily crown: most points left at midnight.'
      : tab === 'week' ? 'Weekly crown: most total points, Monday to Sunday.' + (left > 0 ? ' ' + left + (left === 1 ? ' day' : ' days') + ' left.' : ' Final.')
      : '30-Day Champion: most total points over the last 30 days. Updates every night.';
    const head = tab === 'day' ? `You won ${ahead.length} of ${has.length}` : tab === 'week' ? `Leading ${ahead.length} of ${has.length}` : `Champion in ${ahead.length} of ${has.length}`;
    const won = tab === 'day';
    const row = r => { const d = Math.abs(r.a - r.b), up = r.a > r.b;
      const v = up ? (won ? 'You won by ' : 'You lead by ') + fmt(d) : r.a === r.b ? 'All square' : esc(r.m.name) + (won ? ' won by ' : ' leads by ') + fmt(d);
      const st = streak(r.m);

        <div style="text-align:right;font-size:13px" class="num"><div style="color:${up ? 'var(--gold)' : 'var(--ink)'}">You ${fmt(r.a)}</div><div class="faint">${esc(r.m.name)} ${fmt(r.b)}</div></div><span class="chev">›</span></button>`; };
    const group = (label, list, fn, win) => list.length ? `<p class="lbl" style="margin-top:18px">${label} · ${list.length}</p><div class="card ${win ? 'win' : ''}" style="padding:4px 16px;margin-top:6px">${list.map(fn).join('')}</div>` : '';
    body = `<p class="faint" style="margin-top:0">${rule}</p>
      ${group(won ? 'You won' : 'You lead', ahead, row, true)}${group(won ? 'They won' : 'You trail', behind, row)}
      ${group('No result yet', none, r => `<div class="mrow">${avatar(r.m)}<div class="grow"><b>${esc(r.m.name)}</b><div class="faint">${r.m.startDay >= today() ? 'First battle day is today. Results at 8 AM tomorrow.' : 'Waiting for ' + esc(r.m.name) + '\'s phone to send its total.'}</div></div></div>`)}`;
  }
  const sum = (() => { if (!rs.length) return '';
    const yd = rs.map(m => pair(m, open)).filter(Boolean), yw = yd.filter(p => p[0] > p[1]).length;
    const wk = rs.map(m => totals(m, weekStart(open), open)).filter(t => t.n), ww = wk.filter(t => t.a > t.b).length;
    const t3 = rs.map(m => totals(m, addDays(open, -29), open)).filter(t => t.n), w3 = t3.filter(t => t.a > t.b).length;
    const tile = (id, l, w, n) => `<button class="ct ${tab === id ? 'on' : ''}" onclick="pageState.tab='${id}';repaint()">${l}<div>${id === 'all' ? crown(24, 'pewter') : n ? crown(24, w ? 'gold' : 'pewter') : '–'}</div><b class="${id !== 'all' && w ? 'gold' : ''}">${id === 'all' ? 'Dynasty' : n ? w + ' of ' + n : '–'}</b></button>`;
    return `<div class="ctiles">${tile('day', 'Yesterday', yw, yd.length)}${tile('week', 'This week', ww, wk.length)}${tile('m30', '30 days', w3, t3.length)}${tile('all', 'All time', 0, 0)}</div>`; })();
  return `${backBar('Your battles')}
    ${sum || `<div class="tabs">${tabs.map(t => `<button class="${t[0] === tab ? 'on' : ''}" onclick="pageState.tab='${t[0]}';repaint()">${t[1]}</button>`).join('')}</div>`}

  const t30 = totals(m, addDays(open, -29), open), wk = totals(m, weekStart(open), open), lw = totals(m, addDays(weekStart(open), -7), addDays(weekStart(open), -1));

// ---------- morning notification: 8 AM for everyone, the moment results open ----------
function askNotify(){ if (!S.notify) { S.notify = {on:true}; save(); } return applyNotify(); }
function notifyBody(day){
  const rs = rivals().filter(m => m.startDay && m.startDay < day);
  if (!rs.length) return null;
  let body = rs.length === 1 ? 'Your result with ' + rs[0].name + ' is sealed. Break the seal to see who won.'
    : 'Yesterday\'s crowns are sealed. ' + rs.length + ' results are in. Break the seal to see who won.';
  if (toDate(day).getDay() === 1) body += ' Last week\'s crowns are sealed too.';
  return body;
}
// Schedules the next 7 mornings with the right words. It never names a winner or shows a score.
async function applyNotify(){
  const n = S.notify;
  if (!n || !n.on || !rivals().length) return ST.remindOff().catch(()=>{});
  const items = [];
  for (let i = new Date().getHours() >= REVEAL_HOUR ? 1 : 0; i < 9 && items.length < 7; i++) { const d = addDays(today(), i), body = notifyBody(d); if (body) items.push({day:d, body}); }
  if (!items.length) return ST.remindOff().catch(()=>{});
  const r = await ST.notifySchedule({hour:REVEAL_HOUR, items}).catch(() => ({granted:false}));
  if (!r.granted) { n.on = false; save(); toast('Notifications are off for Conquer in iPhone Settings.'); }
}

  ST.conquerWidget({rivals:rivals().length, held:dc.won, of:dc.of, weekLead:wl.lead, weekOf:wl.of, me: revealed ? S.mine[open] : 0,
    revealed, revealedAt: revealed ? Math.round((S.seenAt || 0) / 1000) : 0, resultDay:open, rows}).catch(()=>{});
}

// ---------- Missions (free for everyone): three a day; each one finished earns a medal. Medals never touch points. ----------
const MISSION_POOL = [
  [{id:'early9', name:'No Red apps before 9 AM', until:9}, {id:'early10', name:'No Red apps before 10 AM', until:10}],
  [{id:'gap2', name:'Two hours in a row with no Red apps', gap:120}, {id:'gap3', name:'Three hours in a row with no Red apps', gap:180}],
  [{id:'keep800', name:'Keep 800 points until 6 PM', keep:800, by:18}, {id:'keep900', name:'Keep 900 points until noon', keep:900, by:12}],
];
function dayHash(d){ let h = 0; for (const c of d) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function missionsFor(d){ const h = dayHash(d); return MISSION_POOL.map((pair, i) => pair[(h >> i) & 1]); }
// Points by the end of an hour, from the hours the phone recorded (Red 40 and Orange 20 per 15 minutes).
function pointsBy(d, hour){
  const x = WH && WH.days[d]; if (!x) return BANK;
  const redBy = Object.entries(x.hours || {}).filter(([h]) => +h < hour).reduce((a, [, m]) => a + m, 0);
  const share = x.red ? redBy / x.red : 0, orangeBy = Math.round((x.orange || 0) * share);

}
function missionsToday(){
  const d = today(), now = new Date(), hr = now.getHours(), x = (WH && WH.days[d]) || {red:0, orange:0, hours:{}};
  const rec = (S.missions = S.missions || {})[d] = (S.missions || {})[d] || {done:{}, best:0};
  return missionsFor(d).map(m => {
    let state = 'open', note = '', prog = null, sub = '';

    else if (m.until) {

      if (used) { state = 'missed'; sub = 'Not today'; } else if (hr >= m.until) { state = 'done'; sub = 'Done at ' + hhmm2(m.until * 60); } else note = 'Until ' + hhmm(m.until * 60);
    } else if (m.gap) {

      const since = Math.max(WH ? WH.redLast || 0 : 0, startOfDay), run = Math.max(0, Math.floor((nowSec() - since) / 60));

      else { prog = rec.best / m.gap; note = (m.gap - rec.best) + ' min to go'; sub = hm(rec.best) + ' so far'; }
    } else if (m.keep) {

      if (pts < m.keep) { state = 'missed'; sub = 'Not today'; } else if (hr >= m.by) { state = 'done'; sub = 'Done at ' + hhmm2(m.by * 60); }
      else { note = 'Until ' + hhmm(m.by * 60); sub = 'You have ' + fmt(pts) + ' now'; }
    }
    if (state === 'done' && !rec.done[m.id]) rec.done[m.id] = sub.replace('Done at ', '');
    return {...m, state, note, prog, sub};

}

    o.innerHTML = `<div class="stage"><p class="lbl">${head}</p>
      <div class="bf-pop" style="margin:10px 0 4px">${crown(72, won ? 'gold' : 'pewter')}</div>
      <div class="d bf-pop" style="font-size:64px;line-height:1.05;color:${won ? 'var(--gold)' : 'var(--ink)'}">${won ? 'You won!' : tie ? 'A tie' : esc(m.name) + ' won'}</div>
      <p class="dim bf-up" style="font-size:22px;margin:4px 0 0">${tie ? 'Same points' : 'by ' + fmt(diff) + ' points'}</p>
      <div class="vs bf-up"><div class="${won ? 'won' : ''}"><div class="cr">${won ? crown(28) : ''}</div><div class="dim s15">You</div><div class="score">${fmt(me)}</div></div>
        <div class="${!won && !tie ? 'lost' : ''}"><div class="cr">${!won && !tie ? crown(28, 'pewter') : ''}</div><div class="dim s15">${esc(m.name)}</div><div class="score">${fmt(b)}</div></div></div>
      ${wk.n > 1 ? `<p class="s15 bf-up" style="color:${wd >= 0 ? 'var(--gold)' : 'var(--dim)'}">${wd > 0 ? 'You\'re ' + fmt(wd) + ' points ahead this week' : wd < 0 ? esc(m.name) + ' is ' + fmt(-wd) + ' points ahead this week' : 'Level on points this week'}</p>` : ''}
      <p class="faint bf-up">New day, new 1,000 points for both of you.</p></div>
      <div style="width:100%;max-width:400px" class="stack"><button onclick="showReveal('${day}')">Watch again</button><button class="main" onclick="closeReveal()">Done</button></div>`;
    if (won) { confetti(o); fx('win'); } else fx('loss');
    return;
  }
  const res = rs.map(m => ({m, b:them(m, day)})), wins = res.filter(r => me > r.b).length, lost = res.filter(r => me < r.b);
  const delay = i => reduced() ? 0 : .35 + i * .45;
  o.innerHTML = `<div class="stage" style="justify-content:flex-start;text-align:left;align-items:stretch;overflow:auto"><p class="lbl">${head}</p>
    <div class="d bf-pop" style="font-size:64px;line-height:1.05;color:var(--gold)">${wins} of ${res.length}</div>
    <p class="dim s15">You hold ${wins} of ${res.length} crowns today. Your ${fmt(me)} counted in every battle.</p>
    <div class="rlist">${res.map((r, i) => { const w = me > r.b, t = me === r.b;
      return `<div class="mrow bf-up" style="animation-delay:${delay(i)}s">${crown(26, w ? 'gold' : 'pewter')}<div class="grow"><b>${w ? 'You beat ' + esc(r.m.name) : t ? 'You tied ' + esc(r.m.name) : esc(r.m.name) + ' won'}</b></div><span class="num faint">${fmt(me)} to ${fmt(r.b)}</span></div>`; }).join('')}</div>
    <p class="faint bf-up" style="animation-delay:${delay(res.length)}s">${lost.length ? esc(listNames(lost.map(r => r.m.name))) + ' got you this time. New day, new 1,000 points.' : 'A clean sweep. New day, new 1,000 points.'}</p></div>
    <div style="width:100%;max-width:400px"><button class="main" onclick="closeReveal()">Done</button></div>`;
  if (wins && wins >= lost.length) { confetti(o); fx('win'); } else fx('loss');
}
function closeReveal(){ const r = $('#reveal'); if (r) r.remove(); render(); }

// ---------- Settings ----------
function settingsView(){
  const n = S.notify || {on:false}, rs = S.matches.filter(m => m.active || (m.ended && m.role !== 'a'));
  const since = d => d ? toDate(d).toLocaleDateString('en-US', {month:'long', day:'numeric'}) : '';
  return `${backBar('Settings')}
    <div class="card" style="padding:4px 16px">
      <div class="setrow"><div class="grow"><b class="s15">Tell me when results are in</b><div class="faint">Results open for everyone at 8 AM, your time.</div></div>
        <label class="sw"><input type="checkbox" id="non" ${n.on ? 'checked' : ''} onchange="setNotify()"><i></i></label></div>
      <div class="setrow"><div class="grow"><b class="s15">Sounds and haptics</b><div class="faint">When you break the seal and see who won. Follows the silent switch.</div></div>
        <label class="sw"><input type="checkbox" id="fxon" ${S.fx !== false ? 'checked' : ''} onchange="S.fx=this.checked;save()"><i></i></label></div>
      ${testMode() ? `<div class="setrow"><div class="grow"><b class="s15">Dynasty (test builds)</b><div class="faint">Turns on Dynasty weapons for testing. Nothing is charged.</div></div>
        <label class="sw"><input type="checkbox" ${S.dynastyTest ? 'checked' : ''} onchange="S.dynastyTest=this.checked;save();render()"><i></i></label></div>` : ''}
      <button class="setrow plain" onclick="changeTiers()"><div class="grow"><b class="s15">My app colors</b><div class="faint">Changes start tomorrow</div></div><span class="chev">›</span></button>
      <div class="setrow"><div class="grow"><b class="s15">Share my daily score</b><div class="faint">Needed to play</div></div><label class="sw"><input type="checkbox" checked disabled><i></i></label></div>
    </div>
    <p class="lbl" style="margin-top:18px">Your battles</p>
    <div class="card" style="padding:4px 16px">${rs.length ? rs.map(m => `<div class="mrow">${avatar(m)}<div class="grow"><b class="s15">${m.ended ? 'Your battle with ' + esc(m.name) + ' has ended' : 'Battle with ' + esc(m.name)}</b><div class="faint">${m.ended ? '' : 'Since ' + since(m.startDay)}${m.role === 'p' ? ' · pretend rival' : ''}</div></div>
      ${m.ended ? `<button class="small" onclick="removeEnded('${m.code}')">Clear</button>` : `<button class="small" onclick="confirmEnd('${m.code}')">End battle</button>`}</div>`).join('')
      : `<div class="mrow"><div class="grow"><b class="s15">No battle right now</b></div><button class="small" onclick="openPage('invites')">Invite a friend</button></div>`}</div>
    <p class="lbl" style="margin-top:18px">What we share</p>
    <div class="card"><p class="faint" style="margin:0">Just your point total for the day. Never how long you were on your phone, which apps you used, or anyone's name. Scores are deleted after ${KEEP_DAYS} days.</p></div>
    <div class="card" style="padding:4px 16px">
      <button class="setrow plain" onclick="toast('Nothing to restore yet.')"><span class="grow s15">Restore purchases</span><span class="chev">›</span></button>
      <button class="setrow plain" style="color:var(--red)" onclick="confirmDelete()"><span class="grow s15">Delete my data</span></button>
    </div>
    <p class="faint" style="text-align:center">Points come from the app's own count, which may not match iPhone Screen Time. It's the same for every player.</p>`;
}
async function setNotify(){ S.notify = {on:$('#non').checked}; save(); await applyNotify(); }
async function changeTiers(){
  for (const t of TIERS) {
    const ok = await new Promise(res => {
      sheet(`<div class="stack"><h2>${t.name}: ${t.cost} points per 15 min</h2><div>${t.ticks.map(x => `<span class="pill" style="color:var(--ink)">${esc(x)}</span>`).join('')}</div><p class="faint">This list stays on screen while you tick. Changes start tomorrow.</p><button class="main" id="ok">Open Apple's list</button><button class="link" id="no">Stop</button></div>`);
      $('#ok').onclick = () => res(true); $('#no').onclick = () => res(false);
    });
    closeSheet(); if (!ok) break;
    let good = await openPicker(t);
    while (good === false) {
      const again = await new Promise(res => {
        sheet(`<div class="stack"><h2>That doesn't look right</h2><p class="dim s15">For ${t.name}, tick only: ${t.ticks.map(esc).join(', ')}.</p><button class="main" id="ok">Try again</button><button class="link" id="no">Skip</button></div>`);
        $('#ok').onclick = () => res(true); $('#no').onclick = () => res(false);
      });
      closeSheet(); if (!again) break;
      good = await openPicker(t);
    }
  }
  toast('Saved. Your changes start tomorrow.'); refresh();
}
function confirmEnd(code){
  const m = S.matches.find(x => x.code === code); if (!m) return;
  sheet(`<div class="stack"><h2>End your battle with ${esc(m.name)}?</h2><p class="dim s15">Are you sure? Your scores and history with ${esc(m.name)} will be cleared, and ${esc(m.name)} will see that the battle ended. You can't undo this.</p>
    <button class="danger" id="yes">Yes, end the battle</button><button class="link" onclick="closeSheet()">Keep playing</button></div>`);
  $('#yes').onclick = async () => { try { await endMatch(m); closeSheet(); render(); } catch(e) { toast('Couldn\'t reach the server. Try again.'); } };
}
function removeEnded(code){ const m = S.matches.find(x => x.code === code); if (m) { S.matches = S.matches.filter(x => x !== m); delete S.res[m.code]; delete S.sentTo[m.code]; save(); } render(); }
function confirmDelete(){
  const names = rivals().map(m => m.name);
  sheet(`<div class="stack"><h2>Delete my data?</h2><p class="dim s15">This deletes your account and all your daily scores from our server, and clears the app on this phone.</p>
    <ul class="dim s15" style="padding-left:20px;margin:0">${names.length ? `<li>Your ${names.length === 1 ? 'battle' : 'battles'} with ${esc(listNames(names))} will end.</li>` : ''}<li>Your wins and history will be gone.</li></ul>
    <button class="danger" id="del" onclick="doDelete()">Delete everything</button><button class="link" onclick="closeSheet()">Cancel</button></div>`);
}
async function doDelete(){
  $('#del').disabled = true;
  try { await deleteAll(); closeSheet(); closePage(); render();
    sheet(`<div class="stack"><h2>All done. Your data is deleted.</h2><p class="dim s15">Nothing of yours is left on our server. You can start again any time.</p><button class="main" onclick="closeSheet()">OK</button></div>`); }
  catch(e) { $('#del').disabled = false; toast('Couldn\'t reach the server. Try again with a connection.'); }
}

// ---------- browser-only test tools (never in the app) ----------
function demoTools(){
  return `<div class="card stack" style="margin-top:28px"><p class="faint">Browser check only: add pretend time.</p>
    <div class="row">${TIERS.map(t => `<button class="small" onclick="demoAdd('${t.id}')">+15m ${t.name}</button>`).join('')}</div>
    <div class="row"><button class="small" onclick="demoDays(1)">Pretend a day passed</button><button class="small" onclick="demoDays(30)">Pretend 30 days</button></div></div>`;
}
function demoAdd(t){ const d = fakeST._d(); const m = d.min[today()] = d.min[today()] || {}; m[t] = (m[t]||0) + 15; save(); refresh(); }
function demoDays(n){
  const d = fakeST._d(), start = addDays(today(), -(n + 1));
  for (let i = 1; i <= n + 1; i++) { const day = addDays(today(), -i); d.min[day] = {red:15*Math.floor(Math.random()*8), orange:15*Math.floor(Math.random()*6)}; delete S.mine[day]; for (const c in S.res) delete S.res[c][day]; for (const c in S.sentTo) delete S.sentTo[c][day]; }
  d.since = [d.since || start, start].sort()[0];
  S.matches.forEach(m => { if (m.active && (!m.startDay || m.startDay > start)) m.startDay = start; });
  S.seen = ''; save(); refresh();
}

// ---------- start ----------
(async function start(){
  load(); await restore();
  render();
  ST.env().then(e => { S.testflight = !!(e && e.testflight); if (!S.setup) render(); }).catch(()=>{});
  if (S.setup) {
    const s = await ST.status().catch(() => ({authorized:true}));
    if (IS_APP && s && s.authorized === false) { S.setup = false; S.setupStep = 'connect'; save(); render(); return; }
    await syncNative();
    applyNotify().catch(()=>{});
    refresh();
  }
  // Coming back to the app (also after "Break the seal" on the morning notification) refreshes, and the reveal shows by itself.
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.setup) refresh(); });
})();
</script>
</body>
</html>
